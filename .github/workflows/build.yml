name: Build OneMace

on:
  workflow_dispatch:
  push:
    branches: [ "1.21.11" ]
  pull_request:
    branches: [ "1.21.11" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Gradle
        run: gradle build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneMace
          path: build/libs/*.jar
